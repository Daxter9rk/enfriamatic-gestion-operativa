name: CI

on:
  push:
    branches: [main, feat/full-v3-dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Functions
        run: npm --prefix functions run validate

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Rules and integrated emulator tests
        run: npm run test:emulators

      - name: Desktop and mobile E2E
        run: npm run test:e2e:emulators
